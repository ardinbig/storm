name: storm
description: A Flutter App for fuel station management.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ^3.41.0

dependencies:
  bloc: ^9.2.0
  envied: ^1.3.4
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  get_it: ^9.2.1
  injectable: ^2.7.1+4
  intl: ^0.20.2
  sentry_flutter: ^9.18.0
  talker_bloc_logger: ^5.1.16
  talker_dio_logger: ^5.1.16
  talker_flutter: ^5.1.16

dev_dependencies:
  bloc_lint: ^0.4.1
  bloc_test: ^10.0.0
  bloc_tools: ^0.1.0-dev.23
  build_runner: ^2.13.1
  envied_generator: ^1.3.4
  flutter_gen_runner: ^5.13.0+1
  flutter_test:
    sdk: flutter
  injectable_generator: ^2.12.1
  mocktail: ^1.0.5
  very_good_analysis: ^10.2.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/

flutter_gen:
  output: lib/assets/
  integrations:
    flutter_svg: true
